
<!doctype html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#10131c">
<title>BeatMorph Audio Lab</title>

<style>
*{box-sizing:border-box}
body{margin:0;background:#0b0e15;color:#f4f6ff;font-family:Arial,sans-serif}
main{max-width:850px;margin:auto;padding:20px}
header{text-align:center;padding:15px}
h1{font-size:38px;margin:5px}
p{color:#b5bfd3}
.panel{background:#151a26;border:1px solid #30384d;border-radius:18px;padding:16px;margin:15px 0}
button{padding:12px;border:1px solid #39425b;border-radius:11px;background:#252c40;color:white;font-size:15px;cursor:pointer}
button:disabled{opacity:.5}
.primary{background:#9b8cff;color:#111;border:0;font-weight:bold}
.row{display:flex;gap:9px;flex-wrap:wrap;align-items:center}
#audio{width:100%;margin-top:15px}
.modes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}
.mode{text-align:left;min-height:65px}
.mode strong,.mode small{display:block}
.mode small{color:#bbc3d6;margin-top:5px}
.mode.active{border-color:#a697ff;background:#393052}
input[type=range]{width:100%;accent-color:#a697ff}
label{display:block;margin:16px 0 6px}
#status{font-size:14px;overflow-wrap:anywhere}
canvas{width:100%;height:90px;background:#080b11;border-radius:10px;margin-top:12px}
@media(max-width:420px){main{padding:10px}.modes{grid-template-columns:1fr}}
</style>
</head>
<body>
<main>
<header>
<h1>BeatMorph</h1>
<p>Audio Lab — Apne music ko naye effects do 🎧</p>
</header>

<section class="panel">
<h3>1. Apna song select karo</h3>
<div class="row">
<input type="file" id="file" accept="audio/*">
<button id="play" class="primary" disabled>▶ Play</button>
<button id="stop" disabled>■ Stop</button>
</div>
<audio id="audio" controls></audio>
<p id="status">Pehle apna audio file select karo.</p>
<canvas id="viz" width="800" height="90"></canvas>
</section>

<section class="panel">
<h3>2. Audio mode select karo</h3>
<div class="modes">
<button class="mode active" data-mode="original"><strong>Original / Clean</strong><small>Normal sound</small></button>
<button class="mode" data-mode="8d"><strong>🎧 8D Audio</strong><small>Left ↔ Right movement</small></button>
<button class="mode" data-mode="bass"><strong>🔊 Bass Boost</strong><small>Heavy bass</small></button>
<button class="mode" data-mode="slowed"><strong>🐢 Slowed + Reverb</strong><small>Slow music + space</small></button>
<button class="mode" data-mode="nightcore"><strong>⚡ Nightcore</strong><small>Fast music</small></button>
<button class="mode" data-mode="echo"><strong>🔁 Echo</strong><small>Repeating sound</small></button>
<button class="mode" data-mode="concert"><strong>🏟 Concert Hall</strong><small>Hall reverb</small></button>
<button class="mode" data-mode="mono"><strong>🎙 Mono Center</strong><small>Center sound</small></button>
</div>
</section>

<section class="panel">
<h3>3. Effect settings</h3>
<label>Effect Strength: <span id="strengthValue">70%</span></label>
<input type="range" id="strength" min="0" max="100" value="70">
<label>Volume: <span id="volumeValue">80%</span></label>
<input type="range" id="volume" min="0" max="100" value="80">
<p>8D effect ko achchhe se sunne ke liye stereo headphones use karo.</p>
</section>
</main>

<script>
(() => {
const $ = id => document.getElementById(id);
const audio = $("audio");
const fileInput = $("file");
const playBtn = $("play");
const stopBtn = $("stop");
const status = $("status");
const strength = $("strength");
const volume = $("volume");
const canvas = $("viz");
const canvasCtx = canvas.getContext("2d");

let ac = null;
let source, bass, panner, master, analyser;
let dry, reverb, reverbGain, delay, delayGain, feedback;
let mode = "original";
let panTimer = null;
let panPhase = 0;
let objectURL = null;

function say(message){ status.textContent = message; }

function makeImpulse(seconds=2.5){
  const length = Math.floor(ac.sampleRate * seconds);
  const buffer = ac.createBuffer(2,length,ac.sampleRate);
  for(let ch=0;ch<2;ch++){
    const data=buffer.getChannelData(ch);
    for(let i=0;i<length;i++){
      data[i]=(Math.random()*2-1)*Math.pow(1-i/length,2.5);
    }
  }
  return buffer;
}

function initAudio(){
  if(ac) return true;
  const AudioContextClass = window.AudioContext || window.webkitAudioContext;
  if(!AudioContextClass){
    say("Web Audio support nahi hai. Updated Chrome use karo.");
    return false;
  }

  ac = new AudioContextClass();
  source = ac.createMediaElementSource(audio);

  bass = ac.createBiquadFilter();
  bass.type = "lowshelf";
  bass.frequency.value = 150;

  panner = ac.createStereoPanner();
  dry = ac.createGain();
  dry.gain.value = 1;

  reverb = ac.createConvolver();
  reverb.buffer = makeImpulse();
  reverbGain = ac.createGain();
  reverbGain.gain.value = 0;

  delay = ac.createDelay(1);
  delay.delayTime.value = 0.3;
  feedback = ac.createGain();
  feedback.gain.value = 0;
  delayGain = ac.createGain();
  delayGain.gain.value = 0;

  master = ac.createGain();
  master.gain.value = Number(volume.value)/100;

  analyser = ac.createAnalyser();
  analyser.fftSize = 256;

  source.connect(bass);
  bass.connect(panner);

  panner.connect(dry);
  dry.connect(master);

  panner.connect(reverb);
  reverb.connect(reverbGain);
  reverbGain.connect(master);

  panner.connect(delay);
  delay.connect(delayGain);
  delay.connect(feedback);
  feedback.connect(delay);
  delayGain.connect(master);

  master.connect(analyser);
  analyser.connect(ac.destination);

  drawVisualizer();
  applyMode();
  return true;
}

function stopPan(){
  if(panTimer){
    clearInterval(panTimer);
    panTimer=null;
  }
  if(ac && panner){
    panner.pan.setTargetAtTime(0,ac.currentTime,0.15);
  }
}

function startPan(){
  if(panTimer) clearInterval(panTimer);
  panTimer=setInterval(()=>{
    if(!ac || !panner || mode!=="8d" || audio.paused) return;
    const speed=0.018 + (Number(strength.value)/100)*0.035;
    panPhase += speed;
    const panValue=Math.sin(panPhase);
    panner.pan.setTargetAtTime(panValue,ac.currentTime,0.12);
  },40);
}

function applyMode(){
  if(!ac) return;
  const s=Number(strength.value)/100;

  bass.gain.setTargetAtTime(mode==="bass" ? 5+13*s : 0,ac.currentTime,0.05);

  reverbGain.gain.setTargetAtTime(
    mode==="concert" ? 0.2+0.45*s :
    mode==="slowed" ? 0.12+0.25*s : 0,
    ac.currentTime,0.08
  );

  delayGain.gain.setTargetAtTime(mode==="echo" ? 0.25+0.35*s : 0,ac.currentTime,0.05);
  feedback.gain.setTargetAtTime(mode==="echo" ? 0.15+0.38*s : 0,ac.currentTime,0.05);
  delay.delayTime.setTargetAtTime(mode==="echo" ? 0.2+0.25*s : 0.3,ac.currentTime,0.05);

  if(mode==="nightcore"){
    audio.playbackRate=1+0.4*s;
  }else if(mode==="slowed"){
    audio.playbackRate=1-0.4*s;
  }else{
    audio.playbackRate=1;
  }

  if(mode==="8d"){
    startPan();
  }else{
    stopPan();
  }

  if(mode==="mono"){
    panner.pan.setTargetAtTime(0,ac.currentTime,0.1);
  }

  say("Selected: "+mode.toUpperCase()+" · Strength "+strength.value+"%");
}

function drawVisualizer(){
  const data=new Uint8Array(analyser.frequencyBinCount);
  function draw(){
    requestAnimationFrame(draw);
    if(!analyser) return;
    analyser.getByteFrequencyData(data);
    canvasCtx.clearRect(0,0,canvas.width,canvas.height);
    const barWidth=canvas.width/data.length;
    for(let i=0;i<data.length;i++){
      const h=(data[i]/255)*canvas.height;
      canvasCtx.fillStyle=mode==="8d" ? "#a697ff" : "#61e6b3";
      canvasCtx.fillRect(i*barWidth,canvas.height-h,Math.max(1,barWidth-1),h);
    }
  }
  draw();
}

fileInput.addEventListener("change",()=>{
  const file=fileInput.files && fileInput.files[0];
  if(!file) return;

  if(objectURL) URL.revokeObjectURL(objectURL);
  objectURL=URL.createObjectURL(file);
  audio.src=objectURL;
  audio.load();
  playBtn.disabled=false;
  stopBtn.disabled=false;
  say("Loaded: "+file.name+" · Play dabao.");
});

playBtn.addEventListener("click",async()=>{
  if(!initAudio()) return;
  try{
    await ac.resume();
    applyMode();
    await audio.play();
    if(mode==="8d") startPan();
    say("Playing: "+(fileInput.files[0]?.name || "Audio"));
  }catch(error){
    say("Audio play nahi hua. Dobara Play dabao ya doosri file select karo.");
  }
});

stopBtn.addEventListener("click",()=>{
  audio.pause();
  audio.currentTime=0;
  stopPan();
});

document.querySelectorAll(".mode").forEach(button=>{
  button.addEventListener("click",()=>{
    document.querySelectorAll(".mode").forEach(b=>b.classList.remove("active"));
    button.classList.add("active");
    mode=button.dataset.mode;
    if(ac) applyMode();
    else say("Selected: "+mode.toUpperCase()+" · Play dabao.");
  });
});

strength.addEventListener("input",()=>{
  $("strengthValue").textContent=strength.value+"%";
  if(ac) applyMode();
});

volume.addEventListener("input",()=>{
  $("volumeValue").textContent=volume.value+"%";
  if(ac) master.gain.setTargetAtTime(Number(volume.value)/100,ac.currentTime,0.05);
});

audio.addEventListener("pause",stopPan);
audio.addEventListener("ended",stopPan);
audio.addEventListener("play",()=>{
  if(ac && ac.state==="suspended") ac.resume();
  if(mode==="8d") startPan();
});

say("Apni audio file select karo.");
})();
</script>
</body>
</html>
